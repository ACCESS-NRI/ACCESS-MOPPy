name: Studio

on:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'src/access_moppy/batch_cmoriser.py'
      - 'src/access_moppy/tracking.py'
      - 'src/access_moppy/templates/**'
      - '.github/workflows/studio.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'src/access_moppy/batch_cmoriser.py'
      - 'src/access_moppy/tracking.py'
      - 'src/access_moppy/templates/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    name: Studio / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build standalone distributions
        run: |
          python -m pip install build
          python -m build apps/studio --outdir "$RUNNER_TEMP/studio-dist"
      - name: Install wheel and test tools
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          wheel = next((Path(os.environ['RUNNER_TEMP']) / 'studio-dist').glob('*.whl'))
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])
          PY
      - name: Lint and check frontend syntax
        run: |
          ruff check apps/studio
          ruff format --check apps/studio
          node --check apps/studio/moppy_studio/web/app.js
          bash -n apps/studio/deploy/install.sh apps/studio/deploy/are/bin/jupyter
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          MOPPY_STUDIO_STATE_DIR: ${{ runner.temp }}/studio-state
        run: |
          moppy-studio --help
          moppy-studio-are --help
          python -m pytest "$GITHUB_WORKSPACE/apps/studio/tests" --import-mode=importlib -q
