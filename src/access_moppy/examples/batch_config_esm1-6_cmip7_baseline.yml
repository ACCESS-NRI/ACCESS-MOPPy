  # --- Daily atmosphere ---
  - atmos.ps.tavg-u-hxy-u.day.glb            # CFday.ps
  - atmos.clt.tavg-u-hxy-u.day.glb           # day.clt
  - atmos.hur.tavg-p19-hxy-u.day.glb         # day.hur
  - atmos.hurs.tavg-h2m-hxy-u.day.glb        # day.hurs
