cmip_version: CMIP7
experiment_id: scen7-vl
source_id: ACCESS-ESM1-6
model_id: ACCESS-ESM1-6
variant_label: r1i1p1f1
# activity_id is selected from the CMIP7 experiment vocabulary.
publication_profile: access-consortium

# Add parent_info for branched runs using the actual parent experiment,
# variant label and branch times from the model run metadata.
input_folder: "YOUR_INPUT_PATH"
output_folder: "YOUR_OUTPUT_PATH"

# For a pilot, set start_year and end_year to one available model year.
# start_year: YEAR
# end_year: YEAR

queue: "normalbw"
cpus_per_node: 12
mem: "64GB"
jobfs: 100GB
use_jobfs_staging: false
walltime: "06:00:00"
scheduler_options: "#PBS -P YOUR_PROJECT"
storage: "gdata/p73+scratch/YOUR_PROJECT+gdata/xp65"
write_prefetch: 4

# Initial allocations; tune against the pilot.
variable_resources:
  # ocean_3d: 18
  ocean.agessc.tavg-ol-hxy-sea.mon.glb: &ocean_3d
    cpus_per_node: 7
    mem: "256GB"
    walltime: "08:00:00"
  ocean.obvfsq.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocean.ocontemppsmadvect.tavg-ol-hxy-sea.yr.glb:
    <<: *ocean_3d
  ocean.osaltpsmadvect.tavg-ol-hxy-sea.yr.glb:
    <<: *ocean_3d
  ocean.osalttend.tavg-ol-hxy-sea.yr.glb:
    <<: *ocean_3d
  ocnBgchem.arag.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.chl.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.detoc.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.dfe.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.dissic.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.expcalc.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.intpp.tavg-u-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.no3.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.o2.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.ph.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.po4.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.talk.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d
  ocnBgchem.zooc.tavg-ol-hxy-sea.mon.glb:
    <<: *ocean_3d

  # other_3d: 6
  atmos.phalf.tavg-alh-hxy-u.mon.glb: &other_3d
    cpus_per_node: 7
    mem: "128GB"
    walltime: "12:00:00"
  land.landCoverFrac.tavg-u-hxy-u.mon.glb:
    <<: *other_3d
  land.mrsfl.tavg-sl-hxy-lnd.mon.glb:
    <<: *other_3d
  land.mrsll.tavg-sl-hxy-lnd.mon.glb:
    <<: *other_3d
  land.mrsol.tavg-d10cm-hxy-lnd.day.glb:
    <<: *other_3d
  land.mrsol.tavg-sl-hxy-lnd.mon.glb:
