# ACCESS-ESM1.6 CMIP7 amip: additional request candidates.
# Output definitions: ACCESS-NRI/access-esm1.6-configs release-amip-1.0
# Config commit: 77eb941dedcb69a0fd5c97854bddad80327e3414
# STASHC: atmosphere/diagnostic_profiles/STASHC_std_concentrations
# MOM5 diag_table: not selected
# CICE history: not selected
# Request: CMIP7 Data Request v1.2.2.5, all priorities/opportunities.
# Variables are beyond the MOPPy baseline example. Every mapped input
# is configured at the requested cadence, and MOPPy has a file search.
# Check actual archive files, grids, calculations and QC in a one-year pilot.
# Fill in paths, PBS project, variant label and parent lineage as needed.

variables:
  # High: 31
  - aerosol.od550aer.tavg-u-hxy-u.mon.glb  # AERmon.od550aer
  - atmos.intuaw.tavg-u-hxy-u.mon.glb  # Emon.intuaw
  - atmos.intvaw.tavg-u-hxy-u.mon.glb  # Emon.intvaw
  - atmos.phalf.tavg-alh-hxy-u.mon.glb  # AERmon.phalf
  - atmos.rls.tavg-u-hxy-u.mon.glb  # Emon.rls
  - atmos.rss.tavg-u-hxy-u.mon.glb  # Emon.rss
  - atmos.rtmt.tavg-u-hxy-u.mon.glb  # Amon.rtmt
  - atmos.sci.tavg-u-hxy-u.mon.glb  # Amon.sci
  - land.cLand.tavg-u-hxy-lnd.mon.glb  # Emon.cLand
  - land.grassFrac.tavg-u-hxy-u.mon.glb  # Lmon.grassFrac
  - land.nep.tavg-u-hxy-lnd.mon.glb  # Emon.nep
  - land.npp.tavg-u-hxy-lnd.mon.glb  # Lmon.npp
  - land.shrubFrac.tavg-u-hxy-u.mon.glb  # Lmon.shrubFrac
  - land.treeFrac.tavg-u-hxy-u.mon.glb  # Lmon.treeFrac
  - land.vegFrac.tavg-u-hxy-u.mon.glb  # Emon.vegFrac
  - land.vegHeight.tavg-u-hxy-veg.mon.glb  # Emon.vegHeight
  - landIce.sbl.tavg-u-hxy-u.mon.glb  # Amon.sbl
  - atmos.hfls.tavg-u-hxy-u.day.glb  # day.hfls
  - atmos.hfss.tavg-u-hxy-u.day.glb  # day.hfss
  - atmos.prc.tavg-u-hxy-u.day.glb  # day.prc
  - atmos.prsn.tavg-u-hxy-u.day.glb  # day.prsn
  - atmos.rlds.tavg-u-hxy-u.day.glb  # day.rlds
  - atmos.rldscs.tavg-u-hxy-u.day.glb  # CFday.rldscs
  - atmos.rlus.tavg-u-hxy-u.day.glb  # day.rlus
  - atmos.rluscs.tavg-u-hxy-u.day.glb  # day.rluscs
  - atmos.rlut.tavg-u-hxy-u.day.glb  # day.rlut
  - atmos.rlutcs.tavg-u-hxy-u.day.glb  # CFday.rlutcs
  - atmos.rsus.tavg-u-hxy-u.day.glb  # day.rsus
  - land.mrro.tavg-u-hxy-lnd.day.glb  # day.mrro
  - land.mrso.tavg-u-hxy-lnd.day.glb  # day.mrso
  - land.mrsol.tavg-d10cm-hxy-lnd.day.glb  # day.mrsos

  # Medium: 4
  - land.cLitter.tavg-u-hxy-lnd.mon.glb  # Lmon.cLitter
  - land.cProduct.tavg-u-hxy-lnd.mon.glb  # Lmon.cProduct
  - atmos.rls.tavg-u-hxy-u.day.glb  # day.rls
  - atmos.rss.tavg-u-hxy-u.day.glb  # day.rss

  # Low: 8
  - land.baresoilFrac.tavg-u-hxy-u.mon.glb  # Lmon.baresoilFrac
  - land.c3PftFrac.tavg-u-hxy-u.mon.glb  # Lmon.c3PftFrac
  - land.c4PftFrac.tavg-u-hxy-u.mon.glb  # Lmon.c4PftFrac
  - land.cropFrac.tavg-u-hxy-u.mon.glb  # Lmon.cropFrac
  - land.cropFracC3.tavg-u-hxy-u.mon.glb  # Emon.cropFracC3
  - land.mrsol.tavg-sl-hxy-lnd.mon.glb  # Emon.mrsol
  - land.residualFrac.tavg-u-hxy-u.mon.glb  # Lmon.residualFrac
  - land.tran.tavg-u-hxy-lnd.mon.glb  # Lmon.tran

cmip_version: CMIP7
experiment_id: amip
source_id: ACCESS-ESM1-6
model_id: ACCESS-ESM1-6
variant_label: r1i1p1f1
# activity_id is selected from the CMIP7 experiment vocabulary.
publication_profile: access-consortium

# Add parent_info for branched runs using the actual parent experiment,
# variant label and branch times from the model run metadata.
input_folder: "YOUR_INPUT_PATH"
output_folder: "YOUR_OUTPUT_PATH"

# For a pilot, set start_year and end_year to one available model year.
# start_year: YEAR
# end_year: YEAR

queue: "normalbw"
cpus_per_node: 12
mem: "64GB"
jobfs: 100GB
use_jobfs_staging: false
walltime: "06:00:00"
scheduler_options: "#PBS -P YOUR_PROJECT"
storage: "gdata/p73+scratch/YOUR_PROJECT+gdata/xp65"
write_prefetch: 4

# Initial allocations; tune against the pilot.
variable_resources:
  # other_3d: 3
  atmos.phalf.tavg-alh-hxy-u.mon.glb: &other_3d
    cpus_per_node: 7
    mem: "128GB"
    walltime: "12:00:00"
  land.mrsol.tavg-d10cm-hxy-lnd.day.glb:
    <<: *other_3d
  land.mrsol.tavg-sl-hxy-lnd.mon.glb:
    <<: *other_3d

worker_init: |
  module use /g/data/xp65/public/modules
  module load conda/analysis3-latest

wait_for_completion: false
qc_plots: false
