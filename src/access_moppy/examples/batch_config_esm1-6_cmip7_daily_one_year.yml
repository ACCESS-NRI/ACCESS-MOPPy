# One-year resource test for ACCESS-ESM1-6 CMIP7 daily variables.
# Replace the input/output paths and verify the parent branch metadata before use.

variables:
  # Surface atmosphere
  - atmos.ps.tavg-u-hxy-u.day.glb
  - atmos.clt.tavg-u-hxy-u.day.glb
  - atmos.hurs.tavg-h2m-hxy-u.day.glb
  - atmos.huss.tavg-h2m-hxy-u.day.glb
  - atmos.pr.tavg-u-hxy-u.day.glb
  - atmos.psl.tavg-u-hxy-u.day.glb
  - atmos.rsds.tavg-u-hxy-u.day.glb
  - atmos.sfcWind.tavg-h10m-hxy-u.day.glb
  - atmos.tas.tavg-h2m-hxy-u.day.glb
  - atmos.tas.tmax-h2m-hxy-u.day.glb
  - atmos.tas.tmin-h2m-hxy-u.day.glb
  - atmos.uas.tavg-h10m-hxy-u.day.glb
  - atmos.vas.tavg-h10m-hxy-u.day.glb

  # 3-D atmosphere on 19 pressure levels
  - atmos.hur.tavg-p19-hxy-u.day.glb
  - atmos.hus.tavg-p19-hxy-u.day.glb
  - atmos.ta.tavg-p19-hxy-air.day.glb
  - atmos.ua.tavg-p19-hxy-air.day.glb
  - atmos.va.tavg-p19-hxy-air.day.glb
  - atmos.wap.tavg-p19-hxy-u.day.glb
  - atmos.zg.tavg-p19-hxy-air.day.glb

  # Surface ocean and sea ice
  - ocean.sos.tavg-u-hxy-sea.day.glb
  - ocean.tos.tavg-u-hxy-sea.day.glb
  - ocean.zos.tavg-u-hxy-sea.day.glb
  - seaIce.siconc.tavg-u-hxy-u.day.glb

start_year: 1850
end_year: 1850

cmip_version: CMIP7
experiment_id: historical
source_id: ACCESS-ESM1-6
variant_label: r1i1p1f1
activity_id: CMIP

parent_info:
  parent_experiment_id: piControl
  parent_activity_id: CMIP
  parent_source_id: ACCESS-ESM1-6
  parent_variant_label: r1i1p1f1
  parent_time_units: "days since 0001-01-01 00:00:00"
  parent_mip_era: CMIP7
  branch_time_in_child: 0.0
  branch_time_in_parent: 0.0    # Replace with the actual branch day.
  branch_method: standard

input_folder: "YOUR_INPUT_PATH"
output_folder: "YOUR_OUTPUT_PATH/daily-1850-test"

enable_chunking: true
max_chunk_size_mb: 128
write_prefetch: 4

# Defaults for 2-D atmosphere, ocean, and sea-ice fields.
queue: "normalbw"
cpus_per_node: 4
mem: "64GB"
jobfs: 100GB
walltime: "06:00:00"
scheduler_options: "#PBS -P iq82"
storage: "gdata/p73+gdata/tm70+scratch/tm70+gdata/xp65+scratch/p73"

# The 19-level fields need more memory and time than the surface fields.
variable_resources:
  atmos.ta.tavg-p19-hxy-air.day.glb: &daily_3d
    cpus_per_node: 7
    mem: "128GB"
    walltime: "12:00:00"
  atmos.ua.tavg-p19-hxy-air.day.glb: { <<: *daily_3d }
  atmos.va.tavg-p19-hxy-air.day.glb: { <<: *daily_3d }
  atmos.hus.tavg-p19-hxy-u.day.glb: { <<: *daily_3d }
  atmos.hur.tavg-p19-hxy-u.day.glb: { <<: *daily_3d }
  atmos.wap.tavg-p19-hxy-u.day.glb: { <<: *daily_3d }
  atmos.zg.tavg-p19-hxy-air.day.glb: { <<: *daily_3d }

worker_init: |
  module use /g/data/xp65/public/modules
  module load conda/analysis3-latest

  # Optional: share measured per-worker memory peaks across runs of the same
  # variable/model, instead of re-guessing from a static file-size heuristic
  # every time. Safe to enable by default: missing/unwritable path or a
  # corrupt file are all treated as "no history yet" and silently fall back
  # to today's heuristic, never fail the job. This is a "one year" run, so
  # its measurements only ever inform runs of the same or smaller scale --
  # a longer production run of the same variable will not be sized off it.
  export MOPPY_WORKER_MEMORY_HISTORY=/g/data/xp65/public/apps/moppy_cache/worker_memory_history.json

wait_for_completion: false
qc_plots: false