# Example configuration for batch CMORisation using PBS
# Each variable will be processed in a separate PBS job with its own Dask cluster

# Option 1: List individual variables to process
variables:
  - Amon.pr
  - Omon.tos
  - Amon.tauu
  - Amon.ts
  - Omon.zos
  - Amon.hfss
  - Amon.rlds
  - Amon.rlus
  - Amon.rsds
  - Amon.rsus

# Option 2: Specify entire CMIP6 tables to process all supported variables.
# Only variables with model mappings available will be included.
# Can be used together with 'variables' above; duplicates are removed.
#
# List form (all tables use the global model_id):
# tables:
#   - Amon
#   - Omon
#
# Dict form (per-table model_id override):
# tables:
#   Amon: ACCESS-ESM1.6
#   Omon: ACCESS-OM2

# Optional: Global model ID for looking up variable mappings (defaults to ACCESS-ESM1.6).
# Per-table values in the dict form above take precedence over this.
# model_id: ACCESS-ESM1.6

# Required: CMIP6 metadata
experiment_id: piControl
source_id: ACCESS-ESM1-5
variant_label: r1i1p1f1
grid_label: gn
activity_id: CMIP

# Required: Input and output paths
input_folder: "/g/data/p73/archive/CMIP7/ACCESS-ESM1-6/spinup/JuneSpinUp-JuneSpinUp-bfaa9c5b"
output_folder: "/scratch/tm70/yz9299/moppy_output_new"


# Optional: File patterns for each variable
# If not specified, will use default patterns
file_patterns:
  Amon.pr: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Omon.tos: "/output00[0-9]/ocean/ocean-2d-surface_temp-1monthly-mean*.nc"
  Amon.tauu: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Amon.ts: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Omon.zos: "/output00[0-9]/ocean/ocean-2d-sea_level-1monthly-mean*.nc"
  Amon.hfss: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Amon.rlds: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Amon.rlus: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Amon.rsds: "/output00[0-9]/atmosphere/netCDF/*mon.nc"
  Amon.rsus: "/output00[0-9]/atmosphere/netCDF/*mon.nc"


# Optional: DRS root (if you want to organize output in CMIP6 DRS structure)
# drs_root: /scratch/tm70/rb5533/moppy_output/CMIP

# PBS job configuration
queue: "normal"
cpus_per_node: 14
mem: "32GB"
jobfs: 100GB
walltime: "06:00:00"
scheduler_options: "#PBS -P tm70"
storage: "gdata/p73+gdata/tm70+scratch/tm70+gdata/xp65"

# Variable-specific resource overrides
variable_resources:
  # 3D ocean variables need more resources
  Omon.thetao:
    cpus_per_node: 28
    mem: 128GB
    walltime: "06:00:00"
    model_id: ACCESS-OM2

  # Per-variable model_id override example
  Omon.tos:
    model_id: ACCESS-OM3

  # Daily data needs more memory
  day.pr:
    cpus_per_node: 14
    mem: 64GB
    walltime: "04:00:00"

  # Simple 2D monthly variables
  Amon.pr:
    cpus_per_node: 8
    mem: 32GB
    walltime: "02:00:00"

# Environment setup for each job
worker_init: |
  module use /g/data/xp65/public/modules
  module load conda/analysis3-26.01

# Optional: Wait for all jobs to complete before exiting
wait_for_completion: false
